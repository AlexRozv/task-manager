{% extends "base.html" %}
{% load crispy_forms_filters %}
{% block content %}
  <h1>Positions list
    <a href="{% url "task_manager_app:position-create" %}" class="btn btn-primary link-to-page">
      Create
    </a>
  </h1>
  <form method="get" action="">
  {% csrf_token %}
  {{ search_form|crispy }}
  <br>
  <input type="submit" class="btn btn-primary" value="search">
  </form>
  <hr>
  <br>
  {% if position_list %}
    {% for position in position_list %}
      <a href="{% url "task_manager_app:position-detail" pk=position.id %}">
        <p>{{ position }}</p>
      </a>
      <hr>
    {% endfor %}
  {% else %}
    <p>there are no positions</p>
  {% endif %}
{% endblock %}
